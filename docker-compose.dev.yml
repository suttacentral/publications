version: "3.9"

services:
  publisher:
    image: paccakkha/suttacentral:suttapublisher_development
    env_file:
      - ./.env_public
    volumes:
      - ./sutta_publisher/src:/app
      - ./sutta_publisher/tests:/tests
      - ./sutta_publisher/assets/fonts:/usr/local/share/fonts/sutta-publisher:ro
      - ./tmp:/tmp
    environment:
      - PYTHONDEBUG=1
      - PYTHONLOGLEVEL=DEBUG
    network_mode: host
